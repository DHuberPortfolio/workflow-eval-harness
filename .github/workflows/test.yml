# Runs on every push and pull request.
#   tests:   the whole suite, on Linux and Windows, on the oldest supported Node (18) and
#            two current ones; then the commands the README and example notes show,
#            including --fail-on, which must stop a build that has a high-severity silent error
#            (or, for graded free text, an invented field), and compare --fail-if-worse, which
#            must stop a change that makes an outcome worse and pass one that makes it better.
#   samples: rebuilds the sample reports the README links to and fails if they differ from
#            the committed copies, so the samples always show what the tool produces today.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - name: The documented commands run
        shell: bash
        run: |
          set -e
          out="$RUNNER_TEMP"
          node bin/wfeval.js score --config test/fixtures/tiny/config.json \
            --pred test/fixtures/tiny/predictions.json --key test/fixtures/tiny/key.json \
            --json "$out/tiny.json" --html "$out/tiny.html"
          C=examples/compliance-reviewer
          node bin/wfeval.js score --config $C/config.json --pred $C/runs/exec-59.harness.json --key $C/key.json
          node bin/wfeval.js variance --config $C/config.json --key $C/key.json $C/runs/exec-5{6,7,8,9}.harness.json
          node bin/wfeval.js compare --config $C/config.json --key $C/key.json \
            --before $C/runs/exec-50.harness.json --after $C/runs/exec-56.harness.json \
            --noise $C/runs/exec-50.harness.json --noise $C/runs/exec-51.harness.json --noise $C/runs/exec-52.harness.json
          M=examples/metadata-enrichment
          node bin/wfeval.js score --config $M/config.json --pred $M/run49.json --key $M/run49.json
          node bin/wfeval.js variance --config $M/config.json --key $M/runs/exec-61.json $M/runs/exec-6{1,2,3}.json
          node bin/wfeval.js whatif --config $M/config.json --pred $M/run49.json --key $M/run49.json --gate
          W=test/fixtures/gate
          node bin/wfeval.js whatif --config $W/config.json --pred $W/predictions.json --key $W/key.json --gate --target 30
          node bin/wfeval.js score --config $C/config.json --pred $C/golden500/exec-67.harness.json --key $C/golden500/exec-67.harness.json
          G=$M/golden500
          node bin/wfeval.js variance --config $G/config.json --key $G/exec-70.json $G/exec-7{0,1,2}.json
          node bin/wfeval.js compare --config $G/config.json --key $G/exec-70.json --before $G/exec-69.json --after $G/exec-71.json \
            --noise $G/exec-70.json --noise $G/exec-71.json --noise $G/exec-72.json
          node bin/wfeval.js score --config $G/config.json --pred $G/exec-72.json --key $G/exec-72.json --target 10 --quiet --json "$out/target.json"
          Q=test/fixtures/queue
          node bin/wfeval.js compare --config $Q/config.json --key $Q/key.json --before $Q/predictions.json --after $Q/predictions-after.json
          node bin/wfeval.js score --config $Q/config.json --pred $Q/predictions.json --key $Q/key.json --group-by channel
          K=test/fixtures/clusters
          node bin/wfeval.js score --config $K/config.json --pred $K/predictions.json --key $K/key.json --cluster-by story
          node bin/wfeval.js score --config $K/config.json --pred $K/predictions.json --key $K/key.json --group-by section --mix $K/mix.json
          node bin/wfeval.js rate 2 15 --target 5
          D=test/fixtures/declines
          node bin/wfeval.js score --config $D/config.json --pred $D/predictions.json --key $D/key.json
          node bin/wfeval.js check --config examples/competitor-registry/config.json
          node bin/wfeval.js score --config test/fixtures/alternatives/config.json \
            --pred test/fixtures/alternatives/predictions.json --key test/fixtures/alternatives/key.json
          R=test/fixtures/rulings
          node bin/wfeval.js score --config $R/config.json --pred $R/predictions.json --key $R/key.json --rulings $R/rulings.json
          node bin/wfeval.js compare --config $R/config.json --key $R/key.json --after-key $R/key-v2.json \
            --before $R/predictions.json --after $R/predictions.json
          F=test/fixtures/freetext
          node bin/wfeval.js grade --config $F/grading.json --pred $F/forms.json --out "$out/grading.html"
          node bin/wfeval.js score --grades $F/grades-a.json --second-reviewer $F/grades-b.json --json "$out/grades.json"
      - name: --fail-on stops a build with a high-severity silent error or invented field; --fail-if-worse one that makes things worse
        shell: bash
        run: |
          set +e
          node bin/wfeval.js score --config test/fixtures/tiny/config.json \
            --pred test/fixtures/tiny/predictions.json --key test/fixtures/tiny/key.json --quiet --fail-on high
          code=$?
          echo "exit code $code (expected 3)"
          test "$code" -eq 3 || exit 1
          node bin/wfeval.js score --grades test/fixtures/freetext/grades-a.json --quiet --fail-on high
          code=$?
          echo "grades: exit code $code (expected 3: invented fields are high)"
          test "$code" -eq 3 || exit 1
          # The queue's change swapped (after as before) brings back 5 unnecessary reviews: worse.
          Q=test/fixtures/queue
          node bin/wfeval.js compare --config $Q/config.json --key $Q/key.json \
            --before $Q/predictions-after.json --after $Q/predictions.json --fail-if-worse unnecessary-reviews > /dev/null
          code=$?
          echo "compare swapped: exit code $code (expected 3: unnecessary reviews worse)"
          test "$code" -eq 3 || exit 1
          node bin/wfeval.js compare --config $Q/config.json --key $Q/key.json \
            --before $Q/predictions.json --after $Q/predictions-after.json --fail-if-worse unnecessary-reviews > /dev/null
          code=$?
          echo "compare in order: exit code $code (expected 0: unnecessary reviews better)"
          test "$code" -eq 0

  samples:
    name: sample reports are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/build-samples.js
      - run: git diff --exit-code docs/samples
