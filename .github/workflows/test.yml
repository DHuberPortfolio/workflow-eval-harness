# Runs on every push and pull request.
#   tests:   the whole suite, on Linux and Windows, on the oldest supported Node (18) and
#            two current ones; then the commands the README and example notes show,
#            including --fail-on, which must stop a build that has a high-severity silent error
#            (or, for graded free text, an invented field), compare --fail-if-worse, which
#            must stop a change that makes an outcome worse and pass one that makes it better,
#            and monitor --fail-on-alarm, which must stop on a rise and pass after a restart;
#            and suspects --write-rulings, which must refuse to write over a file that exists.
#   samples: rebuilds the sample reports the README links to and fails if they differ from
#            the committed copies, so the samples always show what the tool produces today.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - name: The documented commands run
        shell: bash
        run: |
          set -e
          out="$RUNNER_TEMP"
          node bin/wfeval.js score --config test/fixtures/tiny/config.json \
            --pred test/fixtures/tiny/predictions.json --key test/fixtures/tiny/key.json \
            --json "$out/tiny.json" --html "$out/tiny.html"
          C=examples/compliance-reviewer
          node bin/wfeval.js score --config $C/config.json --pred $C/runs/exec-59.harness.json --key $C/key.json
          node bin/wfeval.js variance --config $C/config.json --key $C/key.json $C/runs/exec-5{6,7,8,9}.harness.json
          node bin/wfeval.js compare --config $C/config.json --key $C/key.json \
            --before $C/runs/exec-50.harness.json --after $C/runs/exec-56.harness.json \
            --noise $C/runs/exec-50.harness.json --noise $C/runs/exec-51.harness.json --noise $C/runs/exec-52.harness.json
          M=examples/metadata-enrichment
          node bin/wfeval.js score --config $M/config.json --pred $M/run49.json --key $M/run49.json
          node bin/wfeval.js variance --config $M/config.json --key $M/runs/exec-61.json $M/runs/exec-6{1,2,3}.json
          node bin/wfeval.js whatif --config $M/config.json --pred $M/run49.json --key $M/run49.json --gate
          W=test/fixtures/gate
          node bin/wfeval.js whatif --config $W/config.json --pred $W/predictions.json --key $W/key.json --gate --target 30
          P=test/fixtures/policy
          node bin/wfeval.js whatif --config $P/config.json --pred $P/predictions.json --key $P/key.json --policies $P/policies.json --target 30
          node bin/wfeval.js whatif --config $P/config.json --pred $P/predictions.csv --key $P/key.json --hold-if 'codes=B' --hold-if 'field:match<0.5'
          node bin/wfeval.js score --config $C/config.json --pred $C/golden500/exec-67.harness.json --key $C/golden500/exec-67.harness.json
          node bin/wfeval.js whatif --config $C/config.json --pred $C/golden500/exec-67.harness.json --key $C/golden500/exec-67.harness.json \
            --policies $C/policies.json --target 5
          G=$M/golden500
          node bin/wfeval.js variance --config $G/config.json --key $G/exec-70.json $G/exec-7{0,1,2}.json
          node bin/wfeval.js compare --config $G/config.json --key $G/exec-70.json --before $G/exec-69.json --after $G/exec-71.json \
            --noise $G/exec-70.json --noise $G/exec-71.json --noise $G/exec-72.json
          node bin/wfeval.js score --config $G/config.json --pred $G/exec-72.json --key $G/exec-72.json --target 10 --quiet --json "$out/target.json"
          Q=test/fixtures/queue
          node bin/wfeval.js compare --config $Q/config.json --key $Q/key.json --before $Q/predictions.json --after $Q/predictions-after.json
          node bin/wfeval.js score --config $Q/config.json --pred $Q/predictions.json --key $Q/key.json --group-by channel
          K=test/fixtures/clusters
          node bin/wfeval.js score --config $K/config.json --pred $K/predictions.json --key $K/key.json --cluster-by story
          node bin/wfeval.js score --config $K/config.json --pred $K/predictions.json --key $K/key.json --group-by section --mix $K/mix.json
          node bin/wfeval.js rate 2 15 --target 5
          D=test/fixtures/declines
          node bin/wfeval.js score --config $D/config.json --pred $D/predictions.json --key $D/key.json
          node bin/wfeval.js check --config examples/competitor-registry/config.json
          node bin/wfeval.js score --config test/fixtures/alternatives/config.json \
            --pred test/fixtures/alternatives/predictions.json --key test/fixtures/alternatives/key.json
          R=test/fixtures/rulings
          node bin/wfeval.js score --config $R/config.json --pred $R/predictions.json --key $R/key.json --rulings $R/rulings.json
          node bin/wfeval.js compare --config $R/config.json --key $R/key.json --after-key $R/key-v2.json \
            --before $R/predictions.json --after $R/predictions.json
          F=test/fixtures/freetext
          node bin/wfeval.js grade --config $F/grading.json --pred $F/forms.json --out "$out/grading.html"
          node bin/wfeval.js score --grades $F/grades-a.json --second-reviewer $F/grades-b.json --json "$out/grades.json"
          L=test/fixtures/monitor
          node bin/wfeval.js monitor --config $L/config.json $L/runs/2026-W40.json $L/runs/2026-W41.json $L/runs/2026-W42.json --target 5
          node bin/wfeval.js monitor --counts $L/counts.csv --target 5 --json "$out/monitor.json"
          S=test/fixtures/monitor-segments
          node bin/wfeval.js monitor --counts $S/counts.csv --segment-by segment --segments chat,email,phone --target 5 --acceptable 2.5 --json "$out/segments.json"
          node bin/wfeval.js monitor --config $S/config.json $S/runs/2026-W40.json $S/runs/2026-W41.json $S/runs/2026-W42.json \
            --watch silent-omissions --target 20 --acceptable 10 --segment-by channel
          A=test/fixtures/agree
          node bin/wfeval.js agree --config $A/config.json --keys $A/ann.json $A/ben.json $A/cai.json --json "$out/agree.json" \
            --write-key "$out/majority.json"
          node bin/wfeval.js agree --grades $F/grades-a.json $F/grades-b.json $A/grades-c.json
          E=test/fixtures/estimate
          node bin/wfeval.js estimate --config $E/config.json --pred $E/predictions.json --judge-key $E/judge-key.json --pick 10 --seed 1
          node bin/wfeval.js estimate --config $E/config.json --pred $E/predictions.json --judge-key $E/judge-key.json \
            --key $E/person-key.json --target 50 --json "$out/estimate.json"
          S=test/fixtures/suspects
          node bin/wfeval.js suspects --config $S/config.json --key $S/key.json $S/run-a.json $S/run-b.json \
            --rulings $S/rulings-pending.json --json "$out/suspects.json" --write-rulings "$out/suspects-rulings.json"
          node bin/wfeval.js suspects --config $C/config.json --key $C/runs/exec-56.harness.json $C/runs/exec-5{6,7,8,9}.harness.json \
            --rulings $C/rulings.json --top 10
      - name: A held-out half (split) is drawn, kept hidden, checked and counted
        shell: bash
        run: |
          set -e
          out="$RUNNER_TEMP"
          S=test/fixtures/split
          node bin/wfeval.js check --config $S/config.json --pred $S/predictions.json --key $S/key.json
          node bin/wfeval.js score --config $S/config.json --pred $S/predictions-v2.json --key $S/key.json --target 40 > "$out/split.txt"
          node bin/wfeval.js score --config $S/config.json --pred $S/predictions-v2.json --key $S/key.json --target 40 --held-out > "$out/split-held.txt"
          # The held-out half's silent error (S05) is never named without --show-held-out, looked at or not.
          if grep -q S05 "$out/split.txt" "$out/split-held.txt"; then echo "a held-out record was named"; exit 1; fi
          grep -q "HELD-OUT HALF  not looked at" "$out/split.txt"
          node bin/wfeval.js score --config $S/config.json --pred $S/predictions-v2.json --key $S/key.json --show-held-out | grep -q S05
          # Looks are asked for (--held-out) and counted in a log beside a copy of the config.
          node -e "const fs = require('fs'); const c = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); c.split.log = 'split-log.json'; fs.writeFileSync(process.argv[2], JSON.stringify(c))" $S/config.json "$out/split-config.json"
          node bin/wfeval.js score --config "$out/split-config.json" --pred $S/predictions-v3.json --key $S/key.json --target 40 --quiet
          if [ -e "$out/split-log.json" ]; then echo "a report without --held-out was counted as a look"; exit 1; fi
          node bin/wfeval.js score --config "$out/split-config.json" --pred $S/predictions.json --key $S/key.json --target 40 --quiet --held-out
          node bin/wfeval.js score --config "$out/split-config.json" --pred $S/predictions-v2.json --key $S/key.json --target 40 --held-out | grep -q "Look 2 at this held-out half"
          node bin/wfeval.js check --config "$out/split-config.json" --pred $S/predictions.json --key $S/key.json | grep -q "the next is look 3"
          node bin/wfeval.js whatif --config $S/gate.json --pred test/fixtures/gate/predictions.json --key test/fixtures/gate/key.json --gate --target 40 --held-out
          C=examples/compliance-reviewer
          node bin/wfeval.js whatif --config $C/config-split.json --pred $C/golden500/exec-67.harness.json --key $C/golden500/exec-67.harness.json \
            --policies $C/policies.json --target 5 --held-out
          G=examples/metadata-enrichment/golden500
          node bin/wfeval.js variance --config $G/config-split.json --key $G/exec-70.json $G/exec-7{0,1,2}.json --held-out
          set +e
          node bin/wfeval.js compare --config $S/config.json --key $S/key.json --before $S/predictions.json --after $S/predictions-bad.json \
            --fail-if-worse silent-errors --held-out > /dev/null
          code=$?
          echo "compare: exit code $code (expected 3: silent errors worse on the held-out half)"
          test "$code" -eq 3
      - name: --fail-on stops a build with a high-severity silent error or invented field; --fail-if-worse one that makes things worse
        shell: bash
        run: |
          set +e
          node bin/wfeval.js score --config test/fixtures/tiny/config.json \
            --pred test/fixtures/tiny/predictions.json --key test/fixtures/tiny/key.json --quiet --fail-on high
          code=$?
          echo "exit code $code (expected 3)"
          test "$code" -eq 3 || exit 1
          node bin/wfeval.js score --grades test/fixtures/freetext/grades-a.json --quiet --fail-on high
          code=$?
          echo "grades: exit code $code (expected 3: invented fields are high)"
          test "$code" -eq 3 || exit 1
          # The queue's change swapped (after as before) brings back 5 unnecessary reviews: worse.
          Q=test/fixtures/queue
          node bin/wfeval.js compare --config $Q/config.json --key $Q/key.json \
            --before $Q/predictions-after.json --after $Q/predictions.json --fail-if-worse unnecessary-reviews > /dev/null
          code=$?
          echo "compare swapped: exit code $code (expected 3: unnecessary reviews worse)"
          test "$code" -eq 3 || exit 1
          node bin/wfeval.js compare --config $Q/config.json --key $Q/key.json \
            --before $Q/predictions.json --after $Q/predictions-after.json --fail-if-worse unnecessary-reviews > /dev/null
          code=$?
          echo "compare in order: exit code $code (expected 0: unnecessary reviews better)"
          test "$code" -eq 0 || exit 1
          # Segments: the silent error rate rises in chat only; the whole stays in control, the chat
          # segment alarms. Silent omissions rise in email only. The run files raise no alarm.
          S=test/fixtures/monitor-segments
          node bin/wfeval.js monitor --counts $S/counts.csv --segment-by segment --target 5 --acceptable 2.5 --fail-on-alarm > /dev/null
          code=$?
          echo "monitor segments: exit code $code (expected 3: an alarm in chat)"
          test "$code" -eq 3 || exit 1
          node bin/wfeval.js monitor --counts $S/counts.csv --segment-by segment --watch silent-omissions --target 20 --acceptable 10 --fail-on-alarm > /dev/null
          code=$?
          echo "monitor segments, silent omissions: exit code $code (expected 3: an alarm in email)"
          test "$code" -eq 3 || exit 1
          node bin/wfeval.js monitor --config $S/config.json $S/runs/2026-W40.json $S/runs/2026-W41.json $S/runs/2026-W42.json \
            --watch silent-omissions --target 20 --acceptable 10 --segment-by channel --fail-on-alarm > /dev/null
          code=$?
          echo "monitor run files, silent omissions by channel: exit code $code (expected 0: no alarm)"
          test "$code" -eq 0 || exit 1
          # A counts file whose segment column is not asked for is read as it always was: W40 alarms.
          node bin/wfeval.js monitor --counts $S/segment-column.csv --target 5 --fail-on-alarm > /dev/null
          code=$?
          echo "monitor, segment column without --segment-by: exit code $code (expected 3: an alarm, as before)"
          test "$code" -eq 3 || exit 1
          # The monitor fixture's silent error rate rises: an alarm in 2026-W42, none after a restart in W41.
          L=test/fixtures/monitor
          node bin/wfeval.js monitor --counts $L/counts.csv --target 5 --fail-on-alarm > /dev/null
          code=$?
          echo "monitor: exit code $code (expected 3: an alarm)"
          test "$code" -eq 3 || exit 1
          node bin/wfeval.js monitor --counts $L/counts.csv --target 5 --since 2026-W41 --fail-on-alarm > /dev/null
          code=$?
          echo "monitor --since 2026-W41: exit code $code (expected 0: no alarm since the restart)"
          test "$code" -eq 0 || exit 1
          # suspects --write-rulings never writes over a file that exists: it may hold a person's rulings.
          S=test/fixtures/suspects
          node bin/wfeval.js suspects --config $S/config.json --key $S/key.json $S/run-a.json --write-rulings $S/rulings.json > /dev/null
          code=$?
          echo "suspects --write-rulings onto an existing file: exit code $code (expected 1)"
          test "$code" -eq 1 && git diff --exit-code $S/rulings.json

  samples:
    name: sample reports are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/build-samples.js
      - run: git diff --exit-code docs/samples
